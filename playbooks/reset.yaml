---
- name: Reset Demo — disable EDA activation
  hosts: localhost
  gather_facts: false
  vars:
    aap_gateway: "{{ lookup('ansible.builtin.env', 'AAP_HOSTNAME') | default(lookup('ansible.builtin.env', 'EDA_HOST'), true) }}"
    aap_user: "{{ lookup('ansible.builtin.env', 'AAP_USERNAME') | default(lookup('ansible.builtin.env', 'EDA_USERNAME'), true) }}"
    aap_pass: "{{ lookup('ansible.builtin.env', 'AAP_PASSWORD') | default(lookup('ansible.builtin.env', 'EDA_PASSWORD'), true) }}"
  tasks:
    - name: Delete Rulebook Activation
      ansible.eda.rulebook_activation:
        controller_host: "{{ aap_gateway }}"
        controller_username: "{{ aap_user }}"
        controller_password: "{{ aap_pass }}"
        validate_certs: false
        name: "Kafka Rulebook Activation"
        state: absent

- name: Redeploy OpenShift demo stack
  ansible.builtin.import_playbook: ../casc/playbooks/openshift_stack.yaml

- name: Reset Demo — EDA, ITSM, credentials
  hosts: localhost
  gather_facts: false
  vars:
    itsm_host: "{{ lookup('ansible.builtin.env', 'ITSM_HOST') | regex_replace('/+$', '') }}"
    itsm_user: "{{ lookup('ansible.builtin.env', 'ITSM_USERNAME') }}"
    itsm_pass: "{{ lookup('ansible.builtin.env', 'ITSM_PASSWORD') }}"
    tracked_incident_ref: "{{ lookup('ansible.builtin.env', 'ITSM_INCIDENT') }}"
  tasks:
    - name: Load controller connection vars
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/controller_connection.yml"

    - name: Set AAP aliases from controller connection vars
      ansible.builtin.set_fact:
        aap_gateway: "{{ controller_gateway }}"
        aap_user: "{{ controller_user }}"
        aap_pass: "{{ controller_pass }}"

    - name: Wait for rulebook activation to be deleted
      ansible.eda.rulebook_activation_info:
        controller_host: "{{ aap_gateway }}"
        controller_username: "{{ aap_user }}"
        controller_password: "{{ aap_pass }}"
        name: "Kafka Rulebook Activation"
        validate_certs: false
      register: activation_status
      until: activation_status.activations[0] is not defined
      retries: 30
      delay: 5

    - name: Create Rulebook Activation
      ansible.eda.rulebook_activation:
        controller_host: "{{ aap_gateway }}"
        controller_username: "{{ aap_user }}"
        controller_password: "{{ aap_pass }}"
        validate_certs: false
        name: "Kafka Rulebook Activation"
        description: "Kafka Rulebook Activation"
        project_name: "OpenTelemetry EDA Project"
        rulebook_name: kafka.yaml
        decision_environment_name: EDA Decision Environment
        awx_token_name: "Ansible Controller"
        state: enabled

    - name: Wait for rulebook activation to be running
      ansible.eda.rulebook_activation_info:
        controller_host: "{{ aap_gateway }}"
        controller_username: "{{ aap_user }}"
        controller_password: "{{ aap_pass }}"
        name: "Kafka Rulebook Activation"
        validate_certs: false
      register: activation_status
      until: activation_status.activations[0] is defined and activation_status.activations[0].status == "running"
      retries: 30
      delay: 10

    - name: Validate required Controller credentials
      ansible.builtin.assert:
        that:
          - controller_gateway | length > 0
          - controller_user | length > 0
          - controller_pass | length > 0
        fail_msg: >-
          Missing required controller credentials. Ensure controller/AAP host+credentials
          are injected into this job.

    - name: Validate required ITSM credentials when tracked incident is set
      ansible.builtin.assert:
        that:
          - itsm_host | length > 0
          - itsm_user | length > 0
          - itsm_pass | length > 0
        fail_msg: >-
          ITSM_INCIDENT is set but ITSM_HOST/ITSM_USERNAME/ITSM_PASSWORD are missing.
      when: tracked_incident_ref != 'none'

    - name: Build tracked incident map for role followup
      ansible.builtin.set_fact:
        itsm_incident_by_key:
          tracked: "{{ tracked_incident_ref }}"
      when: tracked_incident_ref != 'none'

    - name: Close tracked ITSM incident via role follow-up
      ansible.builtin.include_role:
        name: itsm_ansible_role
        tasks_from: incident_followups.yml
      vars:
        itsm_api_base_url: "{{ itsm_host }}"
        itsm_api_user: "{{ itsm_user }}"
        itsm_api_password: "{{ itsm_pass }}"
        itsm_validate_certs: false
        itsm_ansible_role_followups: true
        itsm_incident_followups:
          - incident_key: tracked
            comments:
              - body: "Closed by demo reset automation"
            close: {}
      when: tracked_incident_ref != 'none'

    - name: Reset ITSM Incidents credential
      ansible.controller.credential:
        controller_host: "{{ controller_gateway }}"
        controller_username: "{{ controller_user }}"
        controller_password: "{{ controller_pass }}"
        validate_certs: false
        name: "ITSM Incidents Credential"
        organization: "eda_opentelemetry_workshop"
        state: present
        credential_type: "ITSM Incidents"
        inputs:
          itsm_incident: "none"

    - name: Delete project update jobs
      ansible.builtin.uri:
        url: "{{ controller_gateway.rstrip('/') }}/api/controller/v2/system_job_templates/1/launch/"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        method: POST
        validate_certs: false
        force_basic_auth: true
        status_code:
          - 200
          - 201
        body_format: json
        body: '{"extra_vars": {"days": "0"}}'
