---
- name: Close Ticket
  hosts: localhost
  gather_facts: false
  vars:
    controller_gateway: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') | default(lookup('ansible.builtin.env', 'AAP_HOSTNAME'), true) }}"
    controller_user: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') | default(lookup('ansible.builtin.env', 'AAP_USERNAME'), true) }}"
    controller_pass: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') | default(lookup('ansible.builtin.env', 'AAP_PASSWORD'), true) }}"
  tasks:
    - name: Close ITSM incident
      ansible.builtin.uri:
        url: "{{ lookup('ansible.builtin.env', 'ITSM_HOST') }}/api/v1/incidents/{{ lookup('ansible.builtin.env', 'ITSM_INCIDENT') }}/close"
        method: POST
        user: "{{ lookup('ansible.builtin.env', 'ITSM_USERNAME') }}"
        password: "{{ lookup('ansible.builtin.env', 'ITSM_PASSWORD') }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 201]
        body_format: json
        body:
          comment: "Resolved by Event-Driven Ansible — nginx deployment restored on OpenShift"
      when: lookup('ansible.builtin.env', 'ITSM_INCIDENT') != 'none'

    - name: Reset ITSM Incidents credential
      ansible.controller.credential:
        controller_host: "{{ controller_gateway }}"
        controller_username: "{{ controller_user }}"
        controller_password: "{{ controller_pass }}"
        validate_certs: false
        name: "ITSM Incidents Credential"
        organization: "eda_opentelemetry_workshop"
        state: present
        credential_type: "ITSM Incidents"
        inputs:
          itsm_incident: "none"
      when: lookup('ansible.builtin.env', 'ITSM_INCIDENT') != 'none'

    - name: Launch clean demo job template
      ansible.controller.job_launch:
        controller_host: "{{ controller_gateway }}"
        controller_username: "{{ controller_user }}"
        controller_password: "{{ controller_pass }}"
        validate_certs: false
        job_template: "[JT] Clean Demo Environment"
      when: lookup('ansible.builtin.env', 'ITSM_INCIDENT') != 'none'
