custom_credential_types:
  - name: "ITSM"
    kind: cloud
    inputs: "{{ lookup('file', 'credential-types/itsm-inputs.json') }}"
    injectors: "{{ lookup('file', 'credential-types/itsm-injectors.json') }}"
  - name: "ITSM Incidents"
    kind: cloud
    inputs: "{{ lookup('file', 'credential-types/itsm_incidents-inputs.json') }}"
    injectors: "{{ lookup('file', 'credential-types/itsm_incidents-injectors.json') }}"
  - name: "OpenShift Demo"
    kind: cloud
    inputs: "{{ lookup('file', 'credential-types/openshift-inputs.json') }}"
    injectors: "{{ lookup('file', 'credential-types/openshift-injectors.json') }}"
  - name: "Red Hat Event-Driven Ansible"
    kind: cloud
    inputs: "{{ lookup('file', 'credential-types/eda-inputs.json') }}"
    injectors: "{{ lookup('file', 'credential-types/eda-injectors.json') }}"
