---
- name: Close Ticket
  hosts: localhost
  gather_facts: false
  vars:
    itsm_host: "{{ lookup('ansible.builtin.env', 'ITSM_HOST') | regex_replace('/+$', '') }}"
    itsm_user: "{{ lookup('ansible.builtin.env', 'ITSM_USERNAME') }}"
    itsm_pass: "{{ lookup('ansible.builtin.env', 'ITSM_PASSWORD') }}"
    tracked_incident_ref: "{{ lookup('ansible.builtin.env', 'ITSM_INCIDENT') }}"
  tasks:
    - name: Load controller connection vars
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/controller_connection.yml"

    - name: Validate required ITSM and Controller credentials
      ansible.builtin.assert:
        that:
          - itsm_host | length > 0
          - itsm_user | length > 0
          - itsm_pass | length > 0
          - controller_gateway | length > 0
          - controller_user | length > 0
          - controller_pass | length > 0
        fail_msg: >-
          Missing required ITSM or Controller credentials. Ensure ITSM_HOST, ITSM_USERNAME,
          ITSM_PASSWORD, and controller/AAP host+credentials are injected into this job.

    - name: Build tracked incident map for role followup
      ansible.builtin.set_fact:
        itsm_incident_by_key:
          tracked: "{{ tracked_incident_ref }}"
      when: tracked_incident_ref != 'none'

    - name: Close ITSM incident via role follow-up
      ansible.builtin.include_role:
        name: itsm_ansible_role
        tasks_from: incident_followups.yml
      vars:
        itsm_api_base_url: "{{ itsm_host }}"
        itsm_api_user: "{{ itsm_user }}"
        itsm_api_password: "{{ itsm_pass }}"
        itsm_validate_certs: false
        itsm_ansible_role_followups: true
        itsm_incident_followups:
          - incident_key: tracked
            comments:
              - body: "Resolved by Event-Driven Ansible — nginx deployment restored on OpenShift"
            close: {}
      when: tracked_incident_ref != 'none'

    - name: Reset ITSM Incidents credential
      ansible.controller.credential:
        controller_host: "{{ controller_gateway }}"
        controller_username: "{{ controller_user }}"
        controller_password: "{{ controller_pass }}"
        validate_certs: false
        name: "ITSM Incidents Credential"
        organization: "eda_opentelemetry_workshop"
        state: present
        credential_type: "ITSM Incidents"
        inputs:
          itsm_incident: "none"
      when: tracked_incident_ref != 'none'

    - name: Launch clean demo job template
      ansible.controller.job_launch:
        controller_host: "{{ controller_gateway }}"
        controller_username: "{{ controller_user }}"
        controller_password: "{{ controller_pass }}"
        validate_certs: false
        job_template: "[JT] Clean Demo Environment"
      when: tracked_incident_ref != 'none'
