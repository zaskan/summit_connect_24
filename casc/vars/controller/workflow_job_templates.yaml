workflowjobtemplates:
  - name: "[WF] Remediation Pipeline"
    org: "eda_opentelemetry_workshop"
    ask_variables_on_launch: true
    allow_simultaneous: false
    steps:
      - identifier: "Open ITSM Ticket"
        unified_job_template:
          organization:
            name: "eda_opentelemetry_workshop"
          name: "[JT] Open ITSM Ticket"
          type: job_template
        related:
          success_nodes:
            - identifier: "Check ITSM Ticket"
      - identifier: "Check ITSM Ticket"
        unified_job_template:
          organization:
            name: "eda_opentelemetry_workshop"
          description: "Check ITSM Ticket"
          name: "Check ITSM Ticket"
          type: workflow_approval
        related:
          success_nodes:
            - identifier: "Remediate Nginx"
      - identifier: "Remediate Nginx"
        unified_job_template:
          organization:
            name: "eda_opentelemetry_workshop"
          name: "[JT] Remediate Nginx"
          type: job_template
  - name: "[WF] Acceptance Pipeline"
    org: "eda_opentelemetry_workshop"
    ask_variables_on_launch: true
    allow_simultaneous: false
    steps:
      - identifier: "Accept resolution"
        unified_job_template:
          organization:
            name: "eda_opentelemetry_workshop"
          description: "Accept resolution"
          name: "Accept resolution"
          type: workflow_approval
        related:
          success_nodes:
            - identifier: "Close ITSM Ticket"
      - identifier: "Close ITSM Ticket"
        unified_job_template:
          organization:
            name: "eda_opentelemetry_workshop"
          name: "[JT] Close ITSM Ticket"
          type: job_template
