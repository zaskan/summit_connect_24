---
- name: Reset Demo — disable EDA activation
  hosts: localhost
  gather_facts: false
  vars:
    aap_gateway: "{{ lookup('ansible.builtin.env', 'AAP_HOSTNAME') | default(lookup('ansible.builtin.env', 'EDA_HOST'), true) }}"
    aap_user: "{{ lookup('ansible.builtin.env', 'AAP_USERNAME') | default(lookup('ansible.builtin.env', 'EDA_USERNAME'), true) }}"
    aap_pass: "{{ lookup('ansible.builtin.env', 'AAP_PASSWORD') | default(lookup('ansible.builtin.env', 'EDA_PASSWORD'), true) }}"
  tasks:
    - name: Delete Rulebook Activation
      ansible.eda.rulebook_activation:
        controller_host: "{{ aap_gateway }}"
        controller_username: "{{ aap_user }}"
        controller_password: "{{ aap_pass }}"
        validate_certs: false
        name: "Kafka Rulebook Activation"
        state: absent

- name: Redeploy OpenShift demo stack
  ansible.builtin.import_playbook: ../casc/playbooks/openshift_stack.yaml

- name: Reset Demo — EDA, ITSM, credentials
  hosts: localhost
  gather_facts: false
  vars:
    aap_gateway: "{{ lookup('ansible.builtin.env', 'AAP_HOSTNAME') | default(lookup('ansible.builtin.env', 'EDA_HOST'), true) }}"
    aap_user: "{{ lookup('ansible.builtin.env', 'AAP_USERNAME') | default(lookup('ansible.builtin.env', 'EDA_USERNAME'), true) }}"
    aap_pass: "{{ lookup('ansible.builtin.env', 'AAP_PASSWORD') | default(lookup('ansible.builtin.env', 'EDA_PASSWORD'), true) }}"
    controller_gateway: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') | default(aap_gateway, true) }}"
  tasks:
    - name: Wait for rulebook activation to be deleted
      ansible.eda.rulebook_activation_info:
        controller_host: "{{ aap_gateway }}"
        controller_username: "{{ aap_user }}"
        controller_password: "{{ aap_pass }}"
        name: "Kafka Rulebook Activation"
        validate_certs: false
      register: activation_status
      until: activation_status.activations[0] is not defined
      retries: 30
      delay: 5

    - name: Create Rulebook Activation
      ansible.eda.rulebook_activation:
        controller_host: "{{ aap_gateway }}"
        controller_username: "{{ aap_user }}"
        controller_password: "{{ aap_pass }}"
        validate_certs: false
        name: "Kafka Rulebook Activation"
        description: "Kafka Rulebook Activation"
        project_name: "OpenTelemetry EDA Project"
        rulebook_name: kafka.yaml
        decision_environment_name: EDA Decision Environment
        awx_token_name: "Ansible Controller"
        state: enabled

    - name: Wait for rulebook activation to be running
      ansible.eda.rulebook_activation_info:
        controller_host: "{{ aap_gateway }}"
        controller_username: "{{ aap_user }}"
        controller_password: "{{ aap_pass }}"
        name: "Kafka Rulebook Activation"
        validate_certs: false
      register: activation_status
      until: activation_status.activations[0] is defined and activation_status.activations[0].status == "running"
      retries: 30
      delay: 10

    - name: List open ITSM incidents
      ansible.builtin.uri:
        url: "{{ lookup('ansible.builtin.env', 'ITSM_HOST') }}/api/v1/incidents?status=open"
        method: GET
        user: "{{ lookup('ansible.builtin.env', 'ITSM_USERNAME') }}"
        password: "{{ lookup('ansible.builtin.env', 'ITSM_PASSWORD') }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: open_incidents
      when: lookup('ansible.builtin.env', 'ITSM_INCIDENT') == 'none'

    - name: Close open ITSM incidents
      ansible.builtin.uri:
        url: "{{ lookup('ansible.builtin.env', 'ITSM_HOST') }}/api/v1/incidents/{{ item.public_id }}/close"
        method: POST
        user: "{{ lookup('ansible.builtin.env', 'ITSM_USERNAME') }}"
        password: "{{ lookup('ansible.builtin.env', 'ITSM_PASSWORD') }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 201]
        body_format: json
        body:
          comment: "Closed by demo reset automation"
      loop: "{{ open_incidents.json }}"
      when:
        - lookup('ansible.builtin.env', 'ITSM_INCIDENT') == 'none'
        - open_incidents.json is defined

    - name: Close tracked ITSM incident
      ansible.builtin.uri:
        url: "{{ lookup('ansible.builtin.env', 'ITSM_HOST') }}/api/v1/incidents/{{ lookup('ansible.builtin.env', 'ITSM_INCIDENT') }}/close"
        method: POST
        user: "{{ lookup('ansible.builtin.env', 'ITSM_USERNAME') }}"
        password: "{{ lookup('ansible.builtin.env', 'ITSM_PASSWORD') }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 201]
        body_format: json
        body:
          comment: "Closed by demo reset automation"
      when: lookup('ansible.builtin.env', 'ITSM_INCIDENT') != 'none'

    - name: Reset ITSM Incidents credential
      ansible.controller.credential:
        controller_host: "{{ controller_gateway }}"
        controller_username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') | default(aap_user, true) }}"
        controller_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') | default(aap_pass, true) }}"
        validate_certs: false
        name: "ITSM Incidents Credential"
        organization: "eda_opentelemetry_workshop"
        state: present
        credential_type: "ITSM Incidents"
        inputs:
          itsm_incident: "none"

    - name: Delete project update jobs
      ansible.builtin.uri:
        url: "{{ controller_gateway.rstrip('/') }}/api/controller/v2/system_job_templates/1/launch/"
        user: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') | default(aap_user, true) }}"
        password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') | default(aap_pass, true) }}"
        method: POST
        validate_certs: false
        force_basic_auth: true
        status_code:
          - 200
          - 201
        body_format: json
        body: '{"extra_vars": {"days": "0"}}'
