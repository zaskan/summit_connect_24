controller_credentials:
  - name: "Red Hat Ansible Automation Platform Credential"
    desc: "Red Hat Ansible Automation Platform Credential"
    org: "eda_opentelemetry_workshop"
    type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "{{ controller_host }}"
      username: "{{ controller_username }}"
      password: "{{ controller_password }}"

  - name: "Red Hat Event-Driven Ansible Credential"
    desc: "Red Hat Event-Driven Ansible Credential"
    org: "eda_opentelemetry_workshop"
    type: "Red Hat Event-Driven Ansible"
    inputs:
      eda_host: "{{ eda_host }}"
      eda_user: "{{ eda_username }}"
      eda_pass: "{{ eda_password }}"

  - name: "ITSM Credential"
    desc: "ITSM Credential"
    org: "eda_opentelemetry_workshop"
    type: "ITSM"
    inputs:
      itsm_host: "{{ itsm_host }}"
      itsm_username: "{{ itsm_username }}"
      itsm_password: "{{ itsm_password }}"

  - name: "ITSM Incidents Credential"
    desc: "ITSM Incidents Credential"
    org: "eda_opentelemetry_workshop"
    type: "ITSM Incidents"
    inputs:
      itsm_incident: "none"

  - name: "OpenShift Demo Credential"
    desc: "OpenShift API credential for demo remediation"
    org: "eda_opentelemetry_workshop"
    type: "OpenShift Demo"
    inputs:
      openshift_api_host: "{{ openshift_api_host }}"
      openshift_api_token: "{{ openshift_api_token }}"
      openshift_namespace: "{{ openshift_namespace }}"
